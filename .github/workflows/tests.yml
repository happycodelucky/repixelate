name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install the package
        run: python -m pip install .
      - name: The installed command runs
        run: repixel --version
      - name: Tests
        run: python -m unittest discover tests -v

  homebrew:
    name: Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the formula in this repository
        run: |
          brew tap-new --no-git local/repixel
          cp Formula/repixel.rb "$(brew --repository local/repixel)/Formula/"
          brew install local/repixel/repixel
      - name: The installed command runs
        run: repixel --version
      - name: Formula test
        run: brew test local/repixel/repixel
